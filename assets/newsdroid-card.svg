<svg
  width="580"
  height="330"
  viewBox="0 0 580 330"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="580" y2="330">
      <stop offset="0%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#151D2D"/>
    </linearGradient>
  </defs>

  <rect
    x="2"
    y="2"
    width="576"
    height="326"
    rx="22"
    fill="url(#background)"
    stroke="#30363D"
    stroke-width="2"
  />

  <!-- Animated Live Signal -->

  <circle
    cx="525"
    cy="48"
    r="5"
    fill="none"
    stroke="#F6C453"
    stroke-width="2"
  >
    <animate
      attributeName="r"
      values="5;24"
      dur="2.5s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="1;0"
      dur="2.5s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="35"
    y="50"
    fill="#F6C453"
    font-family="monospace"
    font-size="14"
  >
    04 / ANDROID PROJECT
  </text>

  <text
    x="35"
    y="100"
    fill="#FFFFFF"
    font-family="Arial, sans-serif"
    font-size="31"
    font-weight="700"
  >
    NewsDroid
  </text>

  <text
    x="35"
    y="130"
    fill="#F6C453"
    font-family="monospace"
    font-size="15"
  >
    NATIVE ANDROID NEWS APPLICATION
  </text>

  <text
    x="35"
    y="175"
    fill="#A9B1BD"
    font-family="Arial, sans-serif"
    font-size="16"
  >
    Dynamic news browsing with a native Android
  </text>

  <text
    x="35"
    y="200"
    fill="#A9B1BD"
    font-family="Arial, sans-serif"
    font-size="16"
  >
    interface and REST API integration.
  </text>

  <g font-family="monospace" font-size="13">
    <rect x="35" y="235" width="62" height="30" rx="7" fill="#1E293B"/>
    <text x="51" y="255" fill="#F6C453">Java</text>

    <rect x="108" y="235" width="88" height="30" rx="7" fill="#1E293B"/>
    <text x="123" y="255" fill="#F6C453">Android</text>

    <rect x="207" y="235" width="92" height="30" rx="7" fill="#1E293B"/>
    <text x="222" y="255" fill="#F6C453">REST API</text>
  </g>

  <text
    x="35"
    y="305"
    fill="#718096"
    font-family="monospace"
    font-size="13"
  >
    VIEW REPOSITORY
  </text>

  <text
    x="525"
    y="305"
    fill="#F6C453"
    font-family="Arial, sans-serif"
    font-size="25"
  >
    →
  </text>

</svg>