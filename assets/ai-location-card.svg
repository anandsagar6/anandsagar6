<svg
  width="580"
  height="330"
  viewBox="0 0 580 330"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="580" y2="330">
      <stop offset="0%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#151D2D"/>
    </linearGradient>
  </defs>

  <rect
    x="2"
    y="2"
    width="576"
    height="326"
    rx="22"
    fill="url(#background)"
    stroke="#30363D"
    stroke-width="2"
  />

  <!-- Animated Scanner -->

  <line
    x1="25"
    x2="555"
    y1="35"
    y2="35"
    stroke="#F6C453"
    stroke-width="2"
  >
    <animate
      attributeName="y1"
      values="35;295;35"
      dur="6s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="y2"
      values="35;295;35"
      dur="6s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0;0.55;0"
      dur="6s"
      repeatCount="indefinite"
    />
  </line>

  <text
    x="35"
    y="50"
    fill="#F6C453"
    font-family="monospace"
    font-size="14"
  >
    02 / AI PROJECT
  </text>

  <text
    x="35"
    y="100"
    fill="#FFFFFF"
    font-family="Arial, sans-serif"
    font-size="31"
    font-weight="700"
  >
    AI Location Finder
  </text>

  <text
    x="35"
    y="130"
    fill="#F6C453"
    font-family="monospace"
    font-size="15"
  >
    IMAGE → AI → LOCATION
  </text>

  <text
    x="35"
    y="175"
    fill="#A9B1BD"
    font-family="Arial, sans-serif"
    font-size="16"
  >
    AI-powered image analysis for identifying possible
  </text>

  <text
    x="35"
    y="200"
    fill="#A9B1BD"
    font-family="Arial, sans-serif"
    font-size="16"
  >
    real-world locations and geographic coordinates.
  </text>

  <g font-family="monospace" font-size="13">
    <rect x="35" y="235" width="62" height="30" rx="7" fill="#1E293B"/>
    <text x="51" y="255" fill="#F6C453">Java</text>

    <rect x="108" y="235" width="120" height="30" rx="7" fill="#1E293B"/>
    <text x="123" y="255" fill="#F6C453">Spring Boot</text>

    <rect x="239" y="235" width="103" height="30" rx="7" fill="#1E293B"/>
    <text x="254" y="255" fill="#F6C453">Gemini AI</text>
  </g>

  <text
    x="35"
    y="305"
    fill="#718096"
    font-family="monospace"
    font-size="13"
  >
    VIEW REPOSITORY
  </text>

  <text
    x="525"
    y="305"
    fill="#F6C453"
    font-family="Arial, sans-serif"
    font-size="25"
  >
    →
  </text>

</svg>