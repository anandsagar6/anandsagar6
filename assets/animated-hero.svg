<svg
  width="1200"
  height="500"
  viewBox="0 0 1200 500"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Background -->
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="500">
      <stop offset="0%" stop-color="#080D18"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#171D2B"/>
    </linearGradient>

    <!-- Gold -->
    <linearGradient id="gold" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#F6C453"/>
      <stop offset="50%" stop-color="#FFE29A"/>
      <stop offset="100%" stop-color="#F6C453"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#F6C453" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F6C453" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Glow -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

  </defs>

  <!-- ================= BACKGROUND ================= -->

  <rect
    width="1200"
    height="500"
    rx="28"
    fill="url(#background)"
  />

  <!-- Grid -->

  <g opacity="0.07" stroke="#F6C453">

    <path d="M0 50H1200"/>
    <path d="M0 100H1200"/>
    <path d="M0 150H1200"/>
    <path d="M0 200H1200"/>
    <path d="M0 250H1200"/>
    <path d="M0 300H1200"/>
    <path d="M0 350H1200"/>
    <path d="M0 400H1200"/>
    <path d="M0 450H1200"/>

    <path d="M100 0V500"/>
    <path d="M200 0V500"/>
    <path d="M300 0V500"/>
    <path d="M400 0V500"/>
    <path d="M500 0V500"/>
    <path d="M600 0V500"/>
    <path d="M700 0V500"/>
    <path d="M800 0V500"/>
    <path d="M900 0V500"/>
    <path d="M1000 0V500"/>
    <path d="M1100 0V500"/>

  </g>

  <!-- Animated Glow -->

  <circle
    cx="950"
    cy="100"
    r="220"
    fill="url(#glow)"
    filter="url(#softGlow)"
  >
    <animate
      attributeName="opacity"
      values="0.3;0.8;0.3"
      dur="5s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- ================= ANIMATED BORDER ================= -->

  <rect
    x="3"
    y="3"
    width="1194"
    height="494"
    rx="25"
    stroke="url(#gold)"
    stroke-width="2"
    stroke-dasharray="350 1600"
    fill="none"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="1950"
      to="0"
      dur="8s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- ================= TERMINAL TOP BAR ================= -->

  <circle cx="42" cy="38" r="7" fill="#FF5F57"/>
  <circle cx="66" cy="38" r="7" fill="#FEBC2E"/>
  <circle cx="90" cy="38" r="7" fill="#28C840"/>

  <text
    x="600"
    y="44"
    text-anchor="middle"
    fill="#7D8590"
    font-family="monospace"
    font-size="15"
  >
    anand@github: ~/portfolio
  </text>

  <line
    x1="25"
    y1="68"
    x2="1175"
    y2="68"
    stroke="#30363D"
  />

  <!-- ================= TERMINAL COMMAND ================= -->

  <text
    x="70"
    y="125"
    fill="#F6C453"
    font-family="monospace"
    font-size="20"
  >
    anand@github:~$ whoami
  </text>

  <!-- ================= NAME ================= -->

  <text
    x="70"
    y="220"
    fill="#FFFFFF"
    font-family="Arial, sans-serif"
    font-size="68"
    font-weight="700"
    letter-spacing="5"
  >
    ANAND SAGAR
  </text>

  <!-- ================= ROLE ================= -->

  <text
    x="73"
    y="275"
    fill="#F6C453"
    font-family="monospace"
    font-size="27"
    font-weight="600"
    filter="url(#textGlow)"
  >
    FULL STACK DEVELOPER
  </text>

  <!-- ================= STACK ================= -->

  <text
    x="73"
    y="330"
    fill="#A9B1BD"
    font-family="monospace"
    font-size="18"
  >
    Java  •  Spring Boot  •  React  •  Android  •  Firebase
  </text>

  <!-- ================= STATUS ================= -->

  <text
    x="73"
    y="400"
    fill="#D9DDE6"
    font-family="monospace"
    font-size="19"
  >
    &gt; Building modern digital products
  </text>

  <!-- Blinking Cursor -->

  <rect
    x="445"
    y="379"
    width="12"
    height="27"
    rx="2"
    fill="#F6C453"
    filter="url(#textGlow)"
  >
    <animate
      attributeName="opacity"
      values="1;1;0;0;1"
      dur="1.2s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- ================= STATUS INDICATOR ================= -->

  <circle cx="75" cy="455" r="6" fill="#28C840">
    <animate
      attributeName="opacity"
      values="1;0.35;1"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="92"
    y="461"
    fill="#8B949E"
    font-family="monospace"
    font-size="15"
  >
    Available for collaboration and opportunities
  </text>

</svg>