<svg
  width="1200"
  height="430"
  viewBox="0 0 1200 430"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="430">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="48%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#151923"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6C453"/>
      <stop offset="50%" stop-color="#FFE29A"/>
      <stop offset="100%" stop-color="#F6C453"/>
    </linearGradient>

    <radialGradient id="ambientGold">
      <stop offset="0%" stop-color="#F6C453" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#F6C453" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F6C453" stop-opacity="0"/>
    </radialGradient>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="mainClip">
      <rect width="1200" height="430" rx="28"/>
    </clipPath>
  </defs>

  <!-- Background -->

  <rect
    width="1200"
    height="430"
    rx="28"
    fill="url(#background)"
  />

  <!-- Ambient Glow -->

  <circle
    cx="1010"
    cy="130"
    r="260"
    fill="url(#ambientGold)"
  >
    <animate
      attributeName="opacity"
      values="0.45;1;0.45"
      dur="6s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Background Grid -->

  <g
    opacity="0.055"
    stroke="#F6C453"
    clip-path="url(#mainClip)"
  >
    <path d="M0 55H1200"/>
    <path d="M0 110H1200"/>
    <path d="M0 165H1200"/>
    <path d="M0 220H1200"/>
    <path d="M0 275H1200"/>
    <path d="M0 330H1200"/>
    <path d="M0 385H1200"/>

    <path d="M100 0V430"/>
    <path d="M200 0V430"/>
    <path d="M300 0V430"/>
    <path d="M400 0V430"/>
    <path d="M500 0V430"/>
    <path d="M600 0V430"/>
    <path d="M700 0V430"/>
    <path d="M800 0V430"/>
    <path d="M900 0V430"/>
    <path d="M1000 0V430"/>
    <path d="M1100 0V430"/>
  </g>

  <!-- Outer Border -->

  <rect
    x="2"
    y="2"
    width="1196"
    height="426"
    rx="26"
    fill="none"
    stroke="#273142"
    stroke-width="1"
  />

  <!-- Animated Border -->

  <rect
    x="2"
    y="2"
    width="1196"
    height="426"
    rx="26"
    fill="none"
    stroke="url(#gold)"
    stroke-width="2"
    stroke-dasharray="220 3000"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="3220"
      to="0"
      dur="9s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Terminal Buttons -->

  <circle cx="42" cy="35" r="7" fill="#FF5F57"/>
  <circle cx="66" cy="35" r="7" fill="#FEBC2E"/>
  <circle cx="90" cy="35" r="7" fill="#28C840"/>

  <!-- Terminal Title -->

  <text
    x="600"
    y="41"
    text-anchor="middle"
    fill="#718096"
    font-family="monospace"
    font-size="14"
  >
    anand@github — developer.profile()
  </text>

  <line
    x1="25"
    y1="65"
    x2="1175"
    y2="65"
    stroke="#263142"
  />

  <!-- Command -->

  <text
    x="70"
    y="115"
    fill="#F6C453"
    font-family="monospace"
    font-size="18"
  >
    <tspan fill="#28C840">$</tspan>
    <tspan fill="#F6C453"> anand@github:~ </tspan>
    <tspan fill="#D8DEE9">whoami</tspan>
  </text>

  <!-- Name -->

  <text
    x="70"
    y="190"
    fill="#FFFFFF"
    font-family="Arial, sans-serif"
    font-size="59"
    font-weight="700"
    letter-spacing="4"
  >
    ANAND SAGAR
  </text>

  <!-- Animated Underline -->

  <rect
    x="72"
    y="208"
    width="410"
    height="3"
    rx="2"
    fill="url(#gold)"
  >
    <animate
      attributeName="opacity"
      values="0.35;1;0.35"
      dur="3s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Role -->

  <text
    x="72"
    y="255"
    fill="#F6C453"
    font-family="monospace"
    font-size="23"
    font-weight="600"
    filter="url(#textGlow)"
  >
    FULL STACK DEVELOPER
  </text>

  <!-- Stack -->

  <text
    x="72"
    y="302"
    fill="#A9B1BD"
    font-family="monospace"
    font-size="16"
  >
    Java
    <tspan fill="#F6C453"> • </tspan>
    Spring Boot
    <tspan fill="#F6C453"> • </tspan>
    React
    <tspan fill="#F6C453"> • </tspan>
    Android
  </text>

  <!-- Current Status -->

  <text
    x="72"
    y="365"
    fill="#D9DDE6"
    font-family="monospace"
    font-size="17"
  >
    &gt; Building scalable digital products
  </text>

  <!-- Blinking Cursor -->

  <rect
    x="410"
    y="347"
    width="10"
    height="23"
    rx="1"
    fill="#F6C453"
    filter="url(#textGlow)"
  >
    <animate
      attributeName="opacity"
      values="1;1;0;0;1"
      dur="1.1s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Right Profile Panel -->

  <rect
    x="765"
    y="100"
    width="365"
    height="245"
    rx="18"
    fill="#0D1422"
    fill-opacity="0.90"
    stroke="#2A3547"
  />

  <!-- Animated Panel Border -->

  <rect
    x="765"
    y="100"
    width="365"
    height="245"
    rx="18"
    fill="none"
    stroke="#F6C453"
  >
    <animate
      attributeName="stroke-opacity"
      values="0.12;0.45;0.12"
      dur="4s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Status Dot -->

  <circle
    cx="795"
    cy="130"
    r="5"
    fill="#28C840"
  >
    <animate
      attributeName="opacity"
      values="1;0.35;1"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="812"
    y="136"
    fill="#F6C453"
    font-family="monospace"
    font-size="15"
  >
    developer.profile()
  </text>

  <line
    x1="790"
    y1="155"
    x2="1105"
    y2="155"
    stroke="#273142"
  />

  <!-- Role -->

  <text
    x="795"
    y="190"
    fill="#7D8590"
    font-family="monospace"
    font-size="14"
  >
    role
  </text>

  <text
    x="895"
    y="190"
    fill="#FFFFFF"
    font-family="monospace"
    font-size="14"
  >
    Full Stack Developer
  </text>

  <!-- Focus -->

  <text
    x="795"
    y="225"
    fill="#7D8590"
    font-family="monospace"
    font-size="14"
  >
    focus
  </text>

  <text
    x="895"
    y="225"
    fill="#FFFFFF"
    font-family="monospace"
    font-size="14"
  >
    Product Engineering
  </text>

  <!-- Projects -->

  <text
    x="795"
    y="260"
    fill="#7D8590"
    font-family="monospace"
    font-size="14"
  >
    projects
  </text>

  <text
    x="895"
    y="260"
    fill="#F6C453"
    font-family="monospace"
    font-size="14"
  >
    9+
  </text>

  <!-- Status -->

  <text
    x="795"
    y="295"
    fill="#7D8590"
    font-family="monospace"
    font-size="14"
  >
    status
  </text>

  <text
    x="895"
    y="295"
    fill="#28C840"
    font-family="monospace"
    font-size="14"
  >
    ACTIVE / BUILDING
  </text>

  <!-- Panel Footer -->

  <text
    x="795"
    y="325"
    fill="#667085"
    font-family="monospace"
    font-size="12"
  >
    Java • React • Spring Boot • AI
  </text>

  <!-- Floating Code Symbols -->

  <text
    x="1130"
    y="90"
    fill="#F6C453"
    fill-opacity="0.18"
    font-family="monospace"
    font-size="26"
  >
    &lt;/&gt;
    <animate
      attributeName="y"
      values="90;103;90"
      dur="4s"
      repeatCount="indefinite"
    />
  </text>

  <text
    x="700"
    y="395"
    fill="#38BDF8"
    fill-opacity="0.15"
    font-family="monospace"
    font-size="24"
  >
    { }
    <animate
      attributeName="y"
      values="395;380;395"
      dur="5s"
      repeatCount="indefinite"
    />
  </text>

</svg>