          <g><rect class="pill" width="64" height="31" rx="15.5"/><text x="32" y="20" text-anchor="middle" class="mono text" font-size="10.5">Java</text><animateTransform attributeName="transform" type="scale" values="1;1.035;1" dur="4s" repeatCount="indefinite"/></g>
