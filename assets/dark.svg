<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
<title id="title">Anand Sagar — Full Stack Developer</title>
<desc id="desc">Animated premium GitHub profile hero with ASCII portrait, developer terminal, skills and social links.</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030712"/>
    <stop offset=".52" stop-color="#030712"/>
    <stop offset="1" stop-color="#0F172A"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="10s" repeatCount="indefinite"/></stop>
    <stop offset=".5" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="10s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#10B981"><animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="10s" repeatCount="indefinite"/></stop>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="18s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="asciiGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE"/>
    <stop offset=".5" stop-color="#7C3AED"/>
    <stop offset="1" stop-color="#10B981"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#111C31" stop-opacity=".96"/>
    <stop offset="1" stop-color="#0F172A" stop-opacity=".82"/>
  </linearGradient>
  <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF" stop-opacity=".11"/>
    <stop offset=".35" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orb1"><stop stop-color="#7C3AED" stop-opacity=".28"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <radialGradient id="orb2"><stop stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <radialGradient id="orb3"><stop stop-color="#10B981" stop-opacity=".16"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity=".5"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="noise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="8"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .035"/></feComponentTransfer>
  </filter>
  <clipPath id="outerClip"><rect width="1180" height="610" rx="28"/></clipPath>
  <clipPath id="leftClip"><rect x="28" y="28" width="425" height="554" rx="23"/></clipPath>
  <clipPath id="terminalClip"><rect x="477" y="28" width="675" height="554" rx="23"/></clipPath>
  <mask id="scanMask"><rect width="100%" height="100%" fill="white"/></mask>
  <style>
    .ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .ascii{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:12.6px;font-weight:700;fill:url(#asciiGrad);white-space:pre}
    .muted{fill:#94A3B8}.text{fill:#F8FAFC}
    .pill{fill:#111C31;fill-opacity:.72;stroke:#FFFFFF;stroke-opacity:.09}
  </style>
</defs>

<g clip-path="url(#outerClip)">
