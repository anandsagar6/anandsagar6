        <g opacity="0"><animate attributeName="opacity" to="1" dur=".35s" begin="1.75s" fill="freeze"/><text x="520" y="263" class="muted">education</text><text x="612" y="263" class="text">B.Tech CSE · LNCT University · 7.71</text></g>
        <g opacity="0"><animate attributeName="opacity" to="1" dur=".35s" begin="2s" fill="freeze"/><text x="520" y="288" class="muted">focus</text><text x="612" y="288" class="text">Scalable web apps · APIs · Product UI</text></g>
        <g opacity="0"><animate attributeName="opacity" to="1" dur=".35s" begin="2.25s" fill="freeze"/><text x="520" y="313" class="muted">portfolio</text><text x="612" y="313" fill="#22D3EE">Full Stack Product Engineering</text></g>
        <g opacity="0"><animate attributeName="opacity" to="1" dur=".35s" begin="2.5s" fill="freeze"/><text x="520" y="338" class="muted">email</text><text x="612" y="338" class="text">anandsagar0006@gmail.com</text></g>
      </g>

      <g opacity="0"><animate attributeName="opacity" to="1" dur=".5s" begin="2.8s" fill="freeze"/>
