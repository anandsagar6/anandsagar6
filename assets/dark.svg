    <rect x="477" y="28" width="675" height="554" rx="23" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".1"/>
  </g>
  <g clip-path="url(#terminalClip)">
    <path d="M477 28H1152V115L770 28Z" fill="url(#reflection)" opacity=".34"/>
    <rect x="477" y="28" width="675" height="50" fill="#0A1020" fill-opacity=".58"/>
    <line x1="477" y1="78" x2="1152" y2="78" stroke="#FFFFFF" stroke-opacity=".08"/>
    <circle cx="505" cy="53" r="5" fill="#FF5F57"/><circle cx="524" cy="53" r="5" fill="#FEBC2E"/><circle cx="543" cy="53" r="5" fill="#28C840"/>
    <text x="814" y="57" text-anchor="middle" class="mono muted" font-size="11">anand@portfolio ~ developer.profile()</text>
    <g class="ui">
      <g opacity="0"><animate attributeName="opacity" to="1" dur=".5s" begin=".35s" fill="freeze"/>
        <text x="520" y="121" class="muted" font-size="15">Hi 👋</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" to="1" dur=".55s" begin=".7s" fill="freeze"/>
