  <circle cx="110" cy="85" r="240" fill="url(#orb1)"><animate attributeName="cx" values="110;190;110" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="85;145;85" dur="15s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="90" r="270" fill="url(#orb2)"><animate attributeName="cx" values="1040;930;1040" dur="14s" repeatCount="indefinite"/></circle>
