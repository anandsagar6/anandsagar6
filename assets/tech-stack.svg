<svg
  width="1200"
  height="250"
  viewBox="0 0 1200 250"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="250">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#151923"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6C453"/>
      <stop offset="50%" stop-color="#FFE29A"/>
      <stop offset="100%" stop-color="#F6C453"/>
    </linearGradient>

    <clipPath id="contentClip">
      <rect
        x="20"
        y="65"
        width="1160"
        height="165"
        rx="15"
      />
    </clipPath>
  </defs>

  <!-- Background -->

  <rect
    x="1"
    y="1"
    width="1198"
    height="248"
    rx="24"
    fill="url(#background)"
    stroke="#273142"
    stroke-width="2"
  />

  <!-- Header -->

  <text
    x="600"
    y="42"
    text-anchor="middle"
    fill="#F6C453"
    font-family="Arial, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="3"
  >
    TECHNOLOGIES I BUILD WITH
  </text>

  <!-- Decorative Line -->

  <rect
    x="470"
    y="55"
    width="260"
    height="2"
    rx="1"
    fill="url(#gold)"
  >
    <animate
      attributeName="opacity"
      values="0.3;1;0.3"
      dur="3s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Moving Content -->

  <g clip-path="url(#contentClip)">

    <!-- Row One -->

    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="-1200 0"
        dur="20s"
        repeatCount="indefinite"
      />

      <text
        x="40"
        y="120"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="21"
      >
        JAVA  ◆  SPRING BOOT  ◆  REACT  ◆  NEXT.JS  ◆  JAVASCRIPT  ◆  HIBERNATE  ◆  REST APIs  ◆  JDBC  ◆  JAVA  ◆  SPRING BOOT  ◆  REACT
      </text>

      <text
        x="1240"
        y="120"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="21"
      >
        JAVA  ◆  SPRING BOOT  ◆  REACT  ◆  NEXT.JS  ◆  JAVASCRIPT  ◆  HIBERNATE  ◆  REST APIs  ◆  JDBC  ◆  JAVA  ◆  SPRING BOOT  ◆  REACT
      </text>
    </g>

    <!-- Row Two -->

    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        from="-1200 0"
        to="0 0"
        dur="22s"
        repeatCount="indefinite"
      />

      <text
        x="40"
        y="190"
        fill="#F6C453"
        font-family="monospace"
        font-size="21"
      >
        ANDROID  ◆  FIREBASE  ◆  MYSQL  ◆  POSTGRESQL  ◆  GIT  ◆  GITHUB  ◆  LINUX  ◆  POSTMAN  ◆  ANDROID  ◆  FIREBASE  ◆  MYSQL
      </text>

      <text
        x="1240"
        y="190"
        fill="#F6C453"
        font-family="monospace"
        font-size="21"
      >
        ANDROID  ◆  FIREBASE  ◆  MYSQL  ◆  POSTGRESQL  ◆  GIT  ◆  GITHUB  ◆  LINUX  ◆  POSTMAN  ◆  ANDROID  ◆  FIREBASE  ◆  MYSQL
      </text>
    </g>
  </g>

  <!-- Bottom Status -->

  <circle cx="40" cy="225" r="4" fill="#28C840">
    <animate
      attributeName="opacity"
      values="1;0.3;1"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="54"
    y="230"
    fill="#718096"
    font-family="monospace"
    font-size="12"
  >
    continuously learning and building
  </text>

</svg>